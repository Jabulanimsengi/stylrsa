<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Service Worker - Stylr SA</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      background: white;
      padding: 3rem;
      border-radius: 1rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      color: #1a1a1a;
      margin-bottom: 1rem;
    }
    p {
      color: #666;
      margin-bottom: 2rem;
    }
    button {
      padding: 1rem 2rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
    .status {
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 0.5rem;
      display: none;
    }
    .success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }
    .error {
      background: #f8d7da;
      color: #842029;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Clear Service Worker</h1>
    <p>This page automatically unregisters stale localhost service workers and clears cached Next.js assets.</p>
    <button id="clearBtn">Clear Service Worker</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    async function clearServiceWorker() {
      const statusEl = document.getElementById('status');
      const params = new URLSearchParams(window.location.search);
      const returnUrl = params.get('return') || '/';

      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();

          if (registrations.length === 0) {
            statusEl.textContent = 'No service workers found. Redirecting back...';
            statusEl.className = 'status info';
          } else {
            for (const registration of registrations) {
              await registration.unregister();
            }

            if ('caches' in window) {
              const cacheNames = await caches.keys();
              await Promise.all(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }

            try {
              sessionStorage.setItem('stylrsa-dev-sw-redirected', '1');
            } catch (storageError) {}

            statusEl.textContent =
              'Successfully cleared service workers and cached assets. Redirecting back...';
            statusEl.className = 'status success';
          }

          setTimeout(() => {
            window.location.href = returnUrl;
          }, 1500);
          return;
        }

        statusEl.textContent = 'Service workers are not supported in this browser.';
        statusEl.className = 'status info';
      } catch (error) {
        const message = error instanceof Error ? error.message : String(error);
        statusEl.textContent = 'Error: ' + message;
        statusEl.className = 'status error';
      }
    }

    document.getElementById('clearBtn').addEventListener('click', clearServiceWorker);
    window.addEventListener('load', () => {
      clearServiceWorker();
    });
  </script>
</body>
</html>
