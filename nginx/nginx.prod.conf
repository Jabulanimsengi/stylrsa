events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Optimization
    sendfile        on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml;

    # Upstream definitions
    upstream frontend {
        server frontend:8080;
    }

    upstream backend {
        server backend:3001;
    }

    # HTTP -> HTTPS redirect
    server {
        listen 80;
        server_name stylrsa.co.za www.stylrsa.co.za;

        # ACME challenge for Certbot renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        server_name stylrsa.co.za www.stylrsa.co.za;

        ssl_certificate     /etc/letsencrypt/live/stylrsa.co.za/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stylrsa.co.za/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Proxy to Frontend (Next.js)
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.io support
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }
    }
}
